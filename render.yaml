# render.yaml — Render.com Infrastructure-as-Code
#
# Deploy: connect your GitHub repo to Render, it auto-detects this file.
# Docs:   https://render.com/docs/infrastructure-as-code
#
# What this provisions:
#   - One web service (AutoTriage FastAPI app)
#   - One managed Postgres database
#   - All env vars wired up; secrets marked sync:false so you fill them in the dashboard

services:
  - type: web
    name: autotriage
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render's free tier; upgrade to "standard" for always-on + more RAM
    plan: free

    # Render sets PORT automatically; we read it in CMD via $PORT
    # Override: set PORT env var to match what uvicorn listens on
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: PORT
        value: "8000"

      # Render injects DATABASE_URL automatically from the linked Postgres instance
      - key: DATABASE_URL
        fromDatabase:
          name: autotriage-db
          property: connectionString

      # --- Secrets: fill these in the Render dashboard (not here) ---
      - key: LLM_PROVIDER
        sync: false          # you set this in dashboard: "openai" or "anthropic"

      - key: LLM_API_KEY
        sync: false          # your Groq / OpenAI / Anthropic key

      - key: LLM_MODEL
        sync: false          # e.g. llama-3.3-70b-versatile

      - key: OPENAI_API_BASE
        sync: false          # e.g. https://api.groq.com/openai/v1 (leave blank for OpenAI)

      - key: GITHUB_TOKEN
        sync: false          # fine-grained PAT: Contents + PRs read/write

      - key: GITHUB_REPO
        sync: false          # owner/repo — repo AutoTriage correlates errors against

      - key: AUTOTRIAGE_API_KEY
        sync: false          # shared secret for X-API-Key header on POST /api/v1/logs

      - key: ALLOWED_ORIGINS
        sync: false          # comma-separated frontend domains, e.g. https://yourapp.com

databases:
  - name: autotriage-db
    plan: free               # Render free Postgres (expires after 90 days; upgrade for prod)
    databaseName: autotriage
    user: autotriage
